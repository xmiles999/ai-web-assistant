name: 功能建议
description: 提出可验证的产品或开发体验改进
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请说明具体用户场景，而不是只描述实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请说明预期交互、边界和替代方案。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可选。请勿提交 API Key、Cookie 或私密网页内容。
