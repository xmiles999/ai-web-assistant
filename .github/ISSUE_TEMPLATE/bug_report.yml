name: Bug 报告
description: 报告可稳定复现的问题
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请勿提交 API Key、Cookie、网页私密内容或包含敏感信息的截图。
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最小且可重复的步骤。
      placeholder: |
        1. 打开……
        2. 选择……
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与错误信息
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: Chrome 版本、操作系统、扩展版本。
      placeholder: Chrome 126 / Windows 11 / v0.2.1
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: 安全确认
      options:
        - label: 该报告不包含 API Key、Cookie 或其他私密数据。
          required: true
